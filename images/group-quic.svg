<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" aria-hidden="true">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f6ff"/><stop offset="1" stop-color="#e8e0ff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6dff"/><stop offset="1" stop-color="#4a25c9"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2190"/><stop offset="1" stop-color="#1c0f45"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4af0d2"/><stop offset="1" stop-color="#119e87"/></linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#d9ceff"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c4b6ff" opacity="0.5"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a1660" flood-opacity="0.2"/></filter>
    <filter id="spot" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#2a1660" flood-opacity="0.22"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5cff"/></marker>
  </defs>
  <rect x="8" y="34" width="132" height="44" rx="22" fill="url(#tube)" stroke="#b3a1ff" stroke-width="1.5" filter="url(#spot)"/>
  <path d="M22 46 H126" stroke="#2fd3b5" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="15 7"/>
  <path d="M22 56 H126" stroke="#7b5cff" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="15 7"/>
  <path d="M22 66 H126" stroke="#b3a1ff" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="15 7"/>
  <circle cx="136" cy="28" r="16" fill="url(#purple)" filter="url(#spot)"/>
  <path d="M139 16 l-9 14 h6.5 l-3 11 l10 -15 h-6.5 z" fill="#fff"/>
