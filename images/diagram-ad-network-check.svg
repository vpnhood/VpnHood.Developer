<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 324" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Before adding an ad network, read its publisher policy on VPN apps: where it accepts them, the network joins the app's AdMob, Chartboost and InMobi; where it does not, don't add it">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f6ff"/><stop offset="1" stop-color="#e8e0ff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6dff"/><stop offset="1" stop-color="#4a25c9"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2190"/><stop offset="1" stop-color="#1c0f45"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4af0d2"/><stop offset="1" stop-color="#119e87"/></linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#d9ceff"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c4b6ff" opacity="0.5"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a1660" flood-opacity="0.2"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5cff"/></marker>
  </defs>
  <rect x="2" y="2" width="686" height="320" rx="24" fill="url(#backdrop)"/>
  <rect x="2" y="2" width="686" height="320" rx="24" fill="url(#dots)"/>
  <path d="M30 34 H156 L180 58 V246 H30 Z" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#shadow)"/>
  <path d="M156 34 V58 H180" fill="#f4f0ff" stroke="#e0d8ff" stroke-width="2"/>
  <text x="46" y="62" font-size="13" font-weight="800" fill="#1f1640" text-anchor="start">publisher policy</text>
  <rect x="46" y="80" width="112" height="6" rx="3" fill="#e3dbff"/>
  <rect x="46" y="96" width="92" height="6" rx="3" fill="#e3dbff"/>
  <rect x="46" y="112" width="120" height="6" rx="3" fill="#e3dbff"/>
  <rect x="46" y="176" width="104" height="6" rx="3" fill="#e3dbff"/>
  <rect x="46" y="192" width="118" height="6" rx="3" fill="#e3dbff"/>
  <rect x="46" y="208" width="86" height="6" rx="3" fill="#e3dbff"/>
  <rect x="46" y="224" width="108" height="6" rx="3" fill="#e3dbff"/>
  <rect x="40" y="130" width="130" height="34" rx="8" fill="#eafffb" stroke="#2fd3b5" stroke-width="2"/>
  <text x="105" y="152" font-size="14" font-weight="800" fill="#5b37e6" text-anchor="middle">VPN apps?</text>
  <text x="105" y="276" font-size="15" font-weight="600" fill="#1f1640" text-anchor="middle">read it first</text>
  <path d="M186 136 C 226 136, 240 82, 290 82" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="316" cy="82" r="22" fill="url(#teal)" filter="url(#shadow)"/>
  <path d="M309.0 82 l6.4 6.4 l11.6 -12.4" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="316" y="126" font-size="14" font-weight="700" fill="#1f1640" text-anchor="middle">accepted</text>
  <path d="M344 82 H392" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="400" y="30" width="262" height="110" rx="14" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#shadow)"/>
  <text x="416" y="54" font-size="13" font-weight="800" fill="#1f1640" text-anchor="start">your app's ad networks</text>
  <rect x="414" y="66" width="112" height="28" rx="14" fill="#f4f0ff"/>
  <text x="470" y="85" font-size="12.5" font-weight="700" fill="#5d5584" text-anchor="middle">AdMob</text>
  <rect x="536" y="66" width="112" height="28" rx="14" fill="#f4f0ff"/>
  <text x="592" y="85" font-size="12.5" font-weight="700" fill="#5d5584" text-anchor="middle">Chartboost</text>
  <rect x="414" y="102" width="112" height="28" rx="14" fill="#f4f0ff"/>
  <text x="470" y="121" font-size="12.5" font-weight="700" fill="#5d5584" text-anchor="middle">InMobi</text>
  <rect x="536" y="102" width="112" height="28" rx="14" fill="url(#teal)"/>
  <text x="592" y="121" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">+ the new one</text>
  <path d="M186 158 C 226 158, 240 200, 290 200" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="316" cy="200" r="22" fill="#e5484d" filter="url(#shadow)"/>
  <path d="M308.0 192.0 L324.0 208.0 M324.0 192.0 L308.0 208.0" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="316" y="244" font-size="14" font-weight="700" fill="#1f1640" text-anchor="middle">not accepted</text>
  <path d="M344 200 H392" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g opacity="0.45">
  <rect x="400" y="174" width="262" height="52" rx="14" fill="#fff" stroke="#e0d8ff" stroke-width="2"/>
  <text x="531" y="205" font-size="14" font-weight="700" fill="#5d5584" text-anchor="middle">the ad network</text>
  </g>
  <path d="M412 200 H650" stroke="#e5484d" stroke-width="3" stroke-linecap="round"/>
  <text x="531" y="250" font-size="14" font-weight="700" fill="#e5484d" text-anchor="middle">don't add it</text>
  <text x="345" y="302" font-size="15" font-weight="600" fill="#5d5584" text-anchor="middle">Many ad networks do not accept VPN apps: read the policy before you sign up.</text>
</svg>
