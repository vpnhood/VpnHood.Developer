<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Team in the panel: Add Bot adds billing-bot, and the panel shows its API key once">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f6ff"/><stop offset="1" stop-color="#e8e0ff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6dff"/><stop offset="1" stop-color="#4a25c9"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2190"/><stop offset="1" stop-color="#1c0f45"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4af0d2"/><stop offset="1" stop-color="#119e87"/></linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#d9ceff"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c4b6ff" opacity="0.5"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a1660" flood-opacity="0.2"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5cff"/></marker>
  </defs>
  <rect x="2" y="2" width="256" height="156" rx="24" fill="url(#backdrop)"/>
  <rect x="2" y="2" width="256" height="156" rx="24" fill="url(#dots)"/>
  <rect x="12" y="12" width="236" height="96" rx="12" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#shadow)"/>
  <text x="26" y="38" font-size="15" font-weight="800" fill="#1f1640" text-anchor="start">Team</text>
  <rect x="150" y="22" width="86" height="24" rx="12" fill="url(#teal)"/>
  <path d="M166.5 26.14 V30" stroke="#5b37e6" stroke-width="1.43" stroke-linecap="round"/><circle cx="166.5" cy="25.36" r="1.56" fill="#4af0d2"/>
  <rect x="160" y="29" width="13" height="10.4" rx="3.12" fill="#fff"/><circle cx="164.16" cy="33.94" r="1.3" fill="#fff"/><circle cx="168.84" cy="33.94" r="1.3" fill="#fff"/>
  <text x="204" y="38.5" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Add Bot</text>
  <circle cx="36" cy="62.4" r="4.0" fill="url(#purple)"/><path d="M28 73.6 a8 6.8 0 0 1 16 0 z" fill="url(#purple)"/>
  <text x="52" y="70" font-size="12" font-weight="600" fill="#5d5584" text-anchor="start">ana@example.com</text>
  <path d="M36.0 78.48 V83" stroke="#5b37e6" stroke-width="1.76" stroke-linecap="round"/><circle cx="36.0" cy="77.52" r="1.92" fill="#4af0d2"/>
  <rect x="28" y="82" width="16" height="12.8" rx="3.84" fill="url(#purple)"/><circle cx="33.12" cy="88.08" r="1.6" fill="#fff"/><circle cx="38.88" cy="88.08" r="1.6" fill="#fff"/>
  <text x="52" y="94" font-size="12" font-weight="700" fill="#1f1640" text-anchor="start">billing-bot</text>
  <rect x="36" y="100" width="212" height="50" rx="10" fill="url(#deep)" filter="url(#shadow)"/>
  <text x="48" y="117" font-size="11" font-weight="700" fill="#c9bcff" text-anchor="start">API Key</text>
  <text x="48" y="138" font-size="12.5" font-weight="600" fill="#4af0d2" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace">Bearer eyJhbGciOiJIUz…</text>
  <rect x="222" y="124" width="11" height="13" rx="2" fill="none" stroke="#c9bcff" stroke-width="1.8"/><rect x="226" y="120" width="11" height="13" rx="2" fill="#2b1870" stroke="#c9bcff" stroke-width="1.8"/>
</svg>
