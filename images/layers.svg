<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="A VpnHood app: a head over the UI, the app's logic, the VPN engine and the networking libraries">
  <defs>
    <marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#607d8b"/>
    </marker>
  </defs>
  <!-- the same layers and colours as docs/client-architecture.md's diagram -->
  <g stroke="#607d8b" stroke-width="1.5">
    <line x1="210" y1="60" x2="210" y2="78" marker-end="url(#end)"/>
    <line x1="210" y1="132" x2="210" y2="168" marker-start="url(#end)" marker-end="url(#end)"/>
    <line x1="210" y1="222" x2="210" y2="258" marker-start="url(#end)" marker-end="url(#end)"/>
    <line x1="210" y1="310" x2="210" y2="328" marker-end="url(#end)"/>
  </g>
  <g stroke-width="1.5">
    <rect x="40" y="10" width="340" height="50" rx="7" fill="#eceff1" stroke="#546e7a"/>
    <rect x="40" y="80" width="340" height="50" rx="7" fill="#e3f2fd" stroke="#1e88e5"/>
    <rect x="40" y="170" width="340" height="50" rx="7" fill="#e8f5e9" stroke="#43a047"/>
    <rect x="40" y="260" width="340" height="50" rx="7" fill="#fff3e0" stroke="#fb8c00"/>
    <rect x="40" y="330" width="340" height="50" rx="7" fill="#f3e5f5" stroke="#8e24aa"/>
  </g>
  <g fill="#1a1a1a" text-anchor="middle">
    <text x="210" y="32" font-size="15"><tspan font-weight="700">Head</tspan> · the app you publish</text>
    <text x="210" y="50" font-size="12" fill="#455a64">its brand, its store, its platform</text>
    <text x="210" y="102" font-size="15"><tspan font-weight="700">AppUi</tspan> · the user interface</text>
    <text x="210" y="120" font-size="12" fill="#455a64">our Avalonia UI, or yours</text>
    <text x="210" y="192" font-size="15"><tspan font-weight="700">AppLib</tspan> · the app's logic</text>
    <text x="210" y="210" font-size="12" fill="#455a64">settings, profiles, accounts, billing</text>
    <text x="210" y="282" font-size="15"><tspan font-weight="700">Core</tspan> · the VPN service and its engine</text>
    <text x="210" y="300" font-size="12" fill="#455a64">ours, or yours that keeps to contract ②</text>
    <text x="210" y="352" font-size="15"><tspan font-weight="700">Net</tspan> · networking, no VPN</text>
    <text x="210" y="370" font-size="12" fill="#455a64">packets, TCP stack, QUIC, adapters</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <rect x="160" y="140" width="100" height="20" rx="10" fill="#ffffff" stroke="#b0bec5"/>
    <text x="210" y="154" fill="#37474f">① app API</text>
    <rect x="132" y="230" width="156" height="20" rx="10" fill="#ffffff" stroke="#b0bec5"/>
    <text x="210" y="244" fill="#37474f">② VPN service contract</text>
  </g>
</svg>
