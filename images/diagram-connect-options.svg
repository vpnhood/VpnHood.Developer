<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 408" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="What decides a location's options: the person's country, by its client policy, the location, and the app; where a trial or a rewarded ad is offered, the app asks: a free server, a free server for an ad, premium for an ad, a premium trial, or premium bought; a premium key connects at once">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f6ff"/><stop offset="1" stop-color="#e8e0ff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6dff"/><stop offset="1" stop-color="#4a25c9"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2190"/><stop offset="1" stop-color="#1c0f45"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4af0d2"/><stop offset="1" stop-color="#119e87"/></linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#d9ceff"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c4b6ff" opacity="0.5"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a1660" flood-opacity="0.2"/></filter>
    <filter id="spot" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#2a1660" flood-opacity="0.22"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5cff"/></marker>
  </defs>
  <rect x="2" y="2" width="686" height="404" rx="24" fill="url(#backdrop)"/>
  <rect x="2" y="2" width="686" height="404" rx="24" fill="url(#dots)"/>
  <text x="184" y="46" font-size="15" font-weight="700" fill="#1f1640" text-anchor="middle">what decides the options</text>
  <rect x="34" y="64" width="300" height="56" rx="14" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#spot)"/>
  <circle cx="64" cy="92" r="15" fill="url(#purple)"/>  <text x="64" y="97.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">1</text>
  <text x="92" y="88" font-size="15" font-weight="700" fill="#1f1640" text-anchor="start">the person's country</text>
  <text x="92" y="107" font-size="13" font-weight="600" fill="#5d5584" text-anchor="start">picks a client policy</text>
  <path d="M340 92 C 372 92, 380 188, 414 188" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="34" y="132" width="300" height="56" rx="14" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#spot)"/>
  <circle cx="64" cy="160" r="15" fill="url(#purple)"/>  <text x="64" y="165.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">2</text>
  <text x="92" y="156" font-size="15" font-weight="700" fill="#1f1640" text-anchor="start">the location</text>
  <text x="92" y="175" font-size="13" font-weight="600" fill="#5d5584" text-anchor="start">free, premium, or both</text>
  <path d="M340 160 C 372 160, 380 188, 414 188" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="34" y="200" width="300" height="56" rx="14" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#spot)"/>
  <circle cx="64" cy="228" r="15" fill="url(#purple)"/>  <text x="64" y="233.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">3</text>
  <text x="92" y="224" font-size="15" font-weight="700" fill="#1f1640" text-anchor="start">the app</text>
  <text x="92" y="243" font-size="13" font-weight="600" fill="#5d5584" text-anchor="start">rewarded ads? sells premium?</text>
  <path d="M340 228 C 372 228, 380 188, 414 188" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="34" y="284" width="300" height="56" rx="14" fill="#eafffb" stroke="#2fd3b5" stroke-width="2"/>
  <polygon points="64.0,297.0 68.0,306.5 78.3,307.4 70.4,314.1 72.8,324.1 64.0,318.8 55.2,324.1 57.6,314.1 49.7,307.4 60.0,306.5" fill="url(#teal)"/>
  <text x="92" y="308" font-size="15" font-weight="700" fill="#1f1640" text-anchor="start">a premium key</text>
  <text x="92" y="327" font-size="13" font-weight="600" fill="#5d5584" text-anchor="start">connects at once: no choice, no ad</text>
  <rect x="424" y="22" width="200" height="336" rx="24" fill="url(#deep)" filter="url(#shadow)"/>
  <rect x="434" y="38" width="180" height="304" rx="12" fill="#2b1870"/>
  <text x="524" y="62" font-size="11" font-weight="600" fill="#c9bcff" text-anchor="middle">this location is</text>
  <text x="524" y="80" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">free, with premium</text>
  <rect x="444" y="94" width="160" height="38" rx="12" fill="none" stroke="#b3a1ff" stroke-width="2"/>
  <text x="524" y="110" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Free server</text>
  <text x="524" y="125" font-size="10.5" font-weight="600" fill="#e3dbff" text-anchor="middle">30 min</text>
  <rect x="444" y="138" width="160" height="38" rx="12" fill="none" stroke="#b3a1ff" stroke-width="2"/>
  <text x="524" y="154" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Free server by ad</text>
  <text x="524" y="169" font-size="10.5" font-weight="600" fill="#e3dbff" text-anchor="middle">2 hours</text>
  <rect x="444" y="200" width="160" height="38" rx="12" fill="url(#purple)" filter="url(#spot)"/>
  <text x="524" y="216" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Watch an ad</text>
  <text x="524" y="231" font-size="10.5" font-weight="600" fill="#e3dbff" text-anchor="middle">premium, 60 min</text>
  <rect x="444" y="244" width="160" height="38" rx="12" fill="url(#purple)" filter="url(#spot)"/>
  <text x="524" y="260" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Try premium</text>
  <text x="524" y="275" font-size="10.5" font-weight="600" fill="#e3dbff" text-anchor="middle">premium, 30 min</text>
  <rect x="444" y="288" width="160" height="38" rx="12" fill="url(#teal)" filter="url(#spot)"/>
  <text x="524" y="304" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Go premium</text>
  <text x="524" y="319" font-size="10.5" font-weight="600" fill="#e3dbff" text-anchor="middle">buy it, or a code</text>
  <text x="524" y="193" font-size="11" font-weight="700" fill="#c9bcff" text-anchor="middle">or</text>
  <text x="345" y="386" font-size="15" font-weight="600" fill="#5d5584" text-anchor="middle">The app asks when a trial or a rewarded ad is on offer; with neither, it connects at once.</text>
</svg>
