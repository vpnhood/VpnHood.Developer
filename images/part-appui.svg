<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" aria-hidden="true">
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6dff"/><stop offset="1" stop-color="#4a25c9"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4af0d2"/><stop offset="1" stop-color="#119e87"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6aa8ff"/><stop offset="1" stop-color="#1f5fd6"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b19bff"/><stop offset="1" stop-color="#7a5cf2"/></linearGradient>
    <filter id="spot" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#2a1660" flood-opacity="0.22"/></filter>
  </defs>
  <!-- the look: a phone's screen -->
  <rect x="58" y="8" width="44" height="84" rx="9" fill="url(#purple)" filter="url(#spot)"/>
  <rect x="62" y="15" width="36" height="70" rx="5" fill="#f8f6ff"/>
  <circle cx="80" cy="42" r="10" fill="none" stroke="url(#purple)" stroke-width="3.4"/><circle cx="80" cy="42" r="4.2" fill="url(#teal)"/>
  <rect x="68" y="62" width="24" height="8" rx="4" fill="url(#purple)"/>
  <rect x="71" y="75" width="18" height="3.5" rx="1.75" fill="#d9ceff"/>
  <!-- its themes -->
  <circle cx="30" cy="38" r="12" fill="url(#blue)" filter="url(#spot)"/>
  <circle cx="38" cy="58" r="12" fill="url(#violet)" filter="url(#spot)"/>
  <!-- its words -->
  <rect x="112" y="26" width="40" height="16" rx="8" fill="#fff" stroke="#d9cfff" stroke-width="1.5" filter="url(#spot)"/>
  <text x="132" y="37.5" font-size="9" font-weight="700" fill="#3b2190" text-anchor="middle">Aa</text>
  <rect x="108" y="52" width="40" height="16" rx="8" fill="#fff" stroke="#d9cfff" stroke-width="1.5" filter="url(#spot)"/>
  <text x="128" y="63.5" font-size="9" font-weight="700" fill="#3b2190" text-anchor="middle">文</text>
</svg>
