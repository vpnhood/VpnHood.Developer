<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="The app UI: its look in two themes, and its words in every language">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f6ff"/><stop offset="1" stop-color="#e8e0ff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6dff"/><stop offset="1" stop-color="#4a25c9"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2190"/><stop offset="1" stop-color="#1c0f45"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4af0d2"/><stop offset="1" stop-color="#119e87"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6aa8ff"/><stop offset="1" stop-color="#1f5fd6"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b19bff"/><stop offset="1" stop-color="#7a5cf2"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c4b6ff" opacity="0.5"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a1660" flood-opacity="0.2"/></filter>
    <filter id="chip" x="-20%" y="-60%" width="140%" height="280%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a1660" flood-opacity="0.2"/></filter>
  </defs>
  <rect x="2" y="2" width="616" height="296" rx="24" fill="url(#backdrop)"/>
  <rect x="2" y="2" width="616" height="296" rx="24" fill="url(#dots)"/>

  <!-- the themes: one look, its colours by theme -->
  <rect x="44" y="50" width="152" height="74" rx="14" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="72" cy="87" r="16" fill="url(#blue)"/>
  <circle cx="103" cy="87" r="11" fill="#a9ccff"/>
  <circle cx="127" cy="87" r="7" fill="#e3efff" stroke="#c7ddff" stroke-width="1.5"/>
  <text x="144" y="93" font-size="15" font-weight="600" fill="#5d5584" text-anchor="start">blue</text>
  <rect x="44" y="142" width="152" height="74" rx="14" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="72" cy="179" r="16" fill="url(#violet)"/>
  <circle cx="103" cy="179" r="11" fill="#cfc4ff"/>
  <circle cx="127" cy="179" r="7" fill="#efeaff" stroke="#ddd3ff" stroke-width="1.5"/>
  <text x="144" y="185" font-size="15" font-weight="600" fill="#5d5584" text-anchor="start">violet</text>
  <text x="120" y="274" font-size="19" font-weight="600" fill="#1f1640" text-anchor="middle">themes</text>

  <!-- the look: the app's screen -->
  <rect x="254" y="26" width="112" height="210" rx="20" fill="url(#deep)" filter="url(#shadow)"/>
  <rect x="262" y="40" width="96" height="182" rx="10" fill="#f8f6ff"/>
  <rect x="274" y="54" width="36" height="7" rx="3.5" fill="#c9bcff"/>
  <circle cx="340" cy="57.5" r="5" fill="#e3dbff"/>
  <circle cx="310" cy="120" r="30" fill="none" stroke="url(#purple)" stroke-width="8"/>
  <circle cx="310" cy="120" r="12.6" fill="url(#teal)"/>
  <rect x="276" y="170" width="68" height="20" rx="10" fill="url(#purple)"/>
  <rect x="284" y="200" width="52" height="7" rx="3.5" fill="#d9ceff"/>
  <text x="310" y="274" font-size="19" font-weight="600" fill="#1f1640" text-anchor="middle">the look</text>

  <!-- the words: every language -->
  <g font-size="16" font-weight="600" fill="#3b2190" text-anchor="middle">
    <rect x="430" y="40" width="132" height="34" rx="17" fill="#fff" stroke="#d9cfff" stroke-width="2" filter="url(#chip)"/>
    <text x="496" y="62">Connect</text>
    <rect x="430" y="86" width="132" height="34" rx="17" fill="#fff" stroke="#d9cfff" stroke-width="2" filter="url(#chip)"/>
    <text x="496" y="108">Verbinden</text>
    <rect x="430" y="132" width="132" height="34" rx="17" fill="#fff" stroke="#d9cfff" stroke-width="2" filter="url(#chip)"/>
    <text x="496" y="154" direction="rtl" unicode-bidi="embed">اتصال</text>
    <rect x="430" y="178" width="132" height="34" rx="17" fill="#fff" stroke="#d9cfff" stroke-width="2" filter="url(#chip)"/>
    <text x="496" y="200">连接</text>
  </g>
  <text x="496" y="274" font-size="19" font-weight="600" fill="#1f1640" text-anchor="middle">every language</text>
</svg>
