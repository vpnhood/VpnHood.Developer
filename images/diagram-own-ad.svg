<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 366" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="The networks' ads, blocked or with no ad to give, give way to the app's own ad, which always shows, with its countdown, a Close button and a Learn more button">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f6ff"/><stop offset="1" stop-color="#e8e0ff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6dff"/><stop offset="1" stop-color="#4a25c9"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2190"/><stop offset="1" stop-color="#1c0f45"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4af0d2"/><stop offset="1" stop-color="#119e87"/></linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#d9ceff"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c4b6ff" opacity="0.5"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a1660" flood-opacity="0.2"/></filter>
    <filter id="spot" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#2a1660" flood-opacity="0.22"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5cff"/></marker>
  </defs>
  <rect x="2" y="2" width="686" height="362" rx="24" fill="url(#backdrop)"/>
  <rect x="2" y="2" width="686" height="362" rx="24" fill="url(#dots)"/>
  <text x="170" y="52" font-size="15" font-weight="700" fill="#1f1640" text-anchor="middle">the networks' ads</text>
  <rect x="90" y="76" width="160" height="40" rx="12" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#spot)"/>
  <text x="160" y="102" font-size="15" font-weight="700" fill="#1f1640" text-anchor="middle">AdMob</text>
  <circle cx="250" cy="96" r="12" fill="#e5484d"/>
  <path d="M245.5 91.5 L254.5 100.5 M254.5 91.5 L245.5 100.5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="274" y="101" font-size="14" font-weight="600" fill="#5d5584" text-anchor="start">blocked</text>
  <rect x="90" y="136" width="160" height="40" rx="12" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#spot)"/>
  <text x="160" y="162" font-size="15" font-weight="700" fill="#1f1640" text-anchor="middle">Chartboost</text>
  <circle cx="250" cy="156" r="12" fill="#e5484d"/>
  <path d="M245.5 151.5 L254.5 160.5 M254.5 151.5 L245.5 160.5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="274" y="161" font-size="14" font-weight="600" fill="#5d5584" text-anchor="start">no ad</text>
  <rect x="90" y="196" width="160" height="40" rx="12" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#spot)"/>
  <text x="160" y="222" font-size="15" font-weight="700" fill="#1f1640" text-anchor="middle">InMobi</text>
  <circle cx="250" cy="216" r="12" fill="#e5484d"/>
  <path d="M245.5 211.5 L254.5 220.5 M254.5 211.5 L245.5 220.5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="274" y="221" font-size="14" font-weight="600" fill="#5d5584" text-anchor="start">blocked</text>
  <path d="M348 156 H446" fill="none" stroke="#7b5cff" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="460" y="24" width="160" height="262" rx="22" fill="url(#deep)" filter="url(#shadow)"/>
  <rect x="470" y="40" width="140" height="230" rx="12" fill="#2b1870"/>
  <rect x="570" y="50" width="30" height="20" rx="10" fill="#fff" fill-opacity="0.22"/>  <text x="585" y="64.5" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">3</text>
  <circle cx="540" cy="124" r="36" fill="url(#teal)" filter="url(#spot)"/>
  <polygon points="540.0,106.0 545.3,118.7 559.0,119.8 548.6,128.8 551.8,142.2 540.0,135.0 528.2,142.2 531.4,128.8 521.0,119.8 534.7,118.7" fill="#fff"/>
  <text x="540" y="186" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">Go premium</text>
  <rect x="500" y="198" width="80" height="6" rx="3" fill="#8a6dff"/>
  <rect x="476" y="226" width="50" height="30" rx="15" fill="none" stroke="#b3a1ff" stroke-width="2"/>  <text x="501" y="245.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Close</text>
  <rect x="532" y="226" width="72" height="30" rx="15" fill="url(#purple)"/>  <text x="568" y="245.5" font-size="10.5" font-weight="800" fill="#fff" text-anchor="middle">Learn more</text>
  <text x="540" y="312" font-size="15" font-weight="700" fill="#1f1640" text-anchor="middle">the app's own ad: it always shows</text>
  <text x="345" y="344" font-size="15" font-weight="600" fill="#5d5584" text-anchor="middle">Blocked or empty, the networks' ads give way to the app's own: blocking gains nothing.</text>
</svg>
