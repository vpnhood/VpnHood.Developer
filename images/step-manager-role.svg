  <text x="26" y="64" font-size="11" font-weight="700" fill="#5d5584" text-anchor="start">Role</text>
  <rect x="26" y="72" width="208" height="20" rx="6" fill="#f4f0ff"/>
  <text x="36" y="86" font-size="11.5" font-weight="600" fill="#5d5584" text-anchor="start">ProjectReader</text>
  <rect x="26" y="96" width="208" height="20" rx="6" fill="url(#teal)"/>
  <text x="36" y="110" font-size="11.5" font-weight="800" fill="#fff" text-anchor="start">AccessTokenWriter</text>
  <path d="M215.5 106 l3.2 3.2 l5.8 -6.2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="26" y="120" width="208" height="20" rx="6" fill="#f4f0ff"/>
  <text x="36" y="134" font-size="11.5" font-weight="600" fill="#5d5584" text-anchor="start">ProjectWriter</text>
