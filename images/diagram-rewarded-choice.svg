<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="At Connect, a choice between a short free connection and a longer one for a rewarded ad; in the session, a rewarded ad the person asks for adds time">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f6ff"/><stop offset="1" stop-color="#e8e0ff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6dff"/><stop offset="1" stop-color="#4a25c9"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2190"/><stop offset="1" stop-color="#1c0f45"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4af0d2"/><stop offset="1" stop-color="#119e87"/></linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#d9ceff"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c4b6ff" opacity="0.5"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a1660" flood-opacity="0.2"/></filter>
    <filter id="spot" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#2a1660" flood-opacity="0.22"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5cff"/></marker>
  </defs>
  <rect x="2" y="2" width="686" height="348" rx="24" fill="url(#backdrop)"/>
  <rect x="2" y="2" width="686" height="348" rx="24" fill="url(#dots)"/>
  <text x="172" y="46" font-size="16" font-weight="700" fill="#1f1640" text-anchor="middle">at Connect: a choice</text>
  <rect x="102" y="64" width="140" height="232" rx="22" fill="url(#deep)" filter="url(#shadow)"/>
  <rect x="110" y="78" width="124" height="204" rx="12" fill="#2b1870"/>
  <text x="518" y="46" font-size="16" font-weight="700" fill="#1f1640" text-anchor="middle">in the session: more time</text>
  <rect x="448" y="64" width="140" height="232" rx="22" fill="url(#deep)" filter="url(#shadow)"/>
  <rect x="456" y="78" width="124" height="204" rx="12" fill="#2b1870"/>
  <text x="172" y="120" font-size="12" font-weight="700" fill="#e3dbff" text-anchor="middle">How to connect?</text>
  <rect x="120" y="146" width="104" height="42" rx="12" fill="none" stroke="#b3a1ff" stroke-width="2"/>
  <text x="172" y="164" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Free</text>
  <text x="172" y="180" font-size="11" font-weight="600" fill="#c9bcff" text-anchor="middle">30 min</text>
  <rect x="120" y="200" width="104" height="42" rx="12" fill="url(#purple)" filter="url(#spot)"/>
  <text x="172" y="218" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Watch an ad</text>
  <text x="172" y="234" font-size="11" font-weight="600" fill="#e3dbff" text-anchor="middle">2 hours</text>
  <circle cx="518" cy="136" r="38" fill="none" stroke="url(#teal)" stroke-width="6"/>
  <text x="518" y="140" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">24:10</text>
  <text x="518" y="156" font-size="11" font-weight="600" fill="#c9bcff" text-anchor="middle">left</text>
  <rect x="466" y="200" width="104" height="42" rx="12" fill="url(#purple)" filter="url(#spot)"/>
  <text x="518" y="218" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Watch an ad</text>
  <text x="518" y="234" font-size="11" font-weight="600" fill="#e3dbff" text-anchor="middle">+60 min</text>
  <path d="M262 180 H408" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="335" y="170" font-size="13" font-weight="600" fill="#5d5584" text-anchor="middle">then</text>
  <text x="345" y="330" font-size="15" font-weight="600" fill="#5d5584" text-anchor="middle">Either way the person chooses the rewarded ad, and a free connection stays open to them.</text>
</svg>
