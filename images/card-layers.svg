<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="The layers of a VpnHood app, top to bottom: the head you publish, its look and words, the host that runs them on each platform, its logic, the VPN engine and the networking beneath; the app API and the VPN service contract between them">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f6ff"/><stop offset="1" stop-color="#e8e0ff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6dff"/><stop offset="1" stop-color="#4a25c9"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2190"/><stop offset="1" stop-color="#1c0f45"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4af0d2"/><stop offset="1" stop-color="#119e87"/></linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#d9ceff"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c4b6ff" opacity="0.5"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a1660" flood-opacity="0.2"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5cff"/></marker>
  </defs>
  <rect x="2" y="2" width="596" height="426" rx="24" fill="url(#backdrop)"/>
  <rect x="2" y="2" width="596" height="426" rx="24" fill="url(#dots)"/>
  <defs><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b19bff"/><stop offset="1" stop-color="#7a5cf2"/></linearGradient><linearGradient id="mist" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e4dcff"/></linearGradient></defs>
  <defs><linearGradient id="lilac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9f86ff"/><stop offset="1" stop-color="#6142e0"/></linearGradient></defs>
  <rect x="40" y="22" width="520" height="48" rx="14" fill="url(#deep)" filter="url(#shadow)"/>
  <text x="66" y="54" font-size="21" font-weight="800" fill="#fff" text-anchor="start">Head</text>
  <text x="206" y="53" font-size="17" font-weight="500" fill="#cfc4ff" text-anchor="start">the app you publish</text>
  <rect x="40" y="90" width="520" height="48" rx="14" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="66" y="122" font-size="21" font-weight="800" fill="#fff" text-anchor="start">AppUi</text>
  <text x="206" y="121" font-size="17" font-weight="500" fill="#ebe5ff" text-anchor="start">its look and words</text>
  <rect x="40" y="158" width="520" height="48" rx="14" fill="url(#lilac)" filter="url(#shadow)"/>
  <text x="66" y="190" font-size="21" font-weight="800" fill="#fff" text-anchor="start">AppHosting</text>
  <text x="206" y="189" font-size="17" font-weight="500" fill="#f0ebff" text-anchor="start">runs them on each platform</text>
  <rect x="40" y="226" width="520" height="48" rx="14" fill="url(#violet)" filter="url(#shadow)"/>
  <text x="66" y="258" font-size="21" font-weight="800" fill="#fff" text-anchor="start">AppLogic</text>
  <text x="206" y="257" font-size="17" font-weight="500" fill="#f3efff" text-anchor="start">its logic</text>
  <rect x="40" y="294" width="520" height="48" rx="14" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="66" y="326" font-size="21" font-weight="800" fill="#fff" text-anchor="start">Core</text>
  <text x="206" y="325" font-size="17" font-weight="500" fill="#e6fffa" text-anchor="start">the VPN engine</text>
  <rect x="40" y="362" width="520" height="48" rx="14" fill="url(#mist)" stroke="#d9cfff" stroke-width="2" filter="url(#shadow)"/>
  <text x="66" y="394" font-size="21" font-weight="800" fill="#1f1640" text-anchor="start">Net</text>
  <text x="206" y="393" font-size="17" font-weight="500" fill="#5d5584" text-anchor="start">networking, no VPN</text>
  <rect x="411.6" y="202.0" width="120.4" height="28" rx="14" fill="#fff" stroke="#7b5cff" stroke-width="2"/>
  <text x="471.8" y="221.5" font-size="15" font-weight="700" fill="#5b37e6" text-anchor="middle">① app API</text>
  <rect x="286.8" y="270.0" width="245.2" height="28" rx="14" fill="#fff" stroke="#7b5cff" stroke-width="2"/>
  <text x="409.4" y="289.5" font-size="15" font-weight="700" fill="#5b37e6" text-anchor="middle">② VPN service contract</text>
</svg>
