<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="A device's IP packets go into a TUN adapter, and the TCP stack hands your code streams">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f6ff"/><stop offset="1" stop-color="#e8e0ff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6dff"/><stop offset="1" stop-color="#4a25c9"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2190"/><stop offset="1" stop-color="#1c0f45"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4af0d2"/><stop offset="1" stop-color="#119e87"/></linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#d9ceff"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c4b6ff" opacity="0.5"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a1660" flood-opacity="0.2"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5cff"/></marker>
  </defs>
  <rect x="2" y="2" width="616" height="296" rx="24" fill="url(#backdrop)"/>
  <rect x="2" y="2" width="616" height="296" rx="24" fill="url(#dots)"/>
  <rect x="34" y="104" width="138" height="96" rx="10" fill="url(#deep)" filter="url(#shadow)"/>
  <rect x="44" y="114" width="118" height="76" rx="5" fill="#2b1870"/>
  <rect x="56" y="128" width="64" height="8" rx="4" fill="#4af0d2"/>
  <rect x="56" y="147" width="92" height="8" rx="4" fill="#8a6dff"/>
  <rect x="56" y="166" width="50" height="8" rx="4" fill="#c9bcff"/>
  <path d="M22 202 H184 L174 218 H32 Z" fill="#d3c7ff"/>
  <text x="103" y="258" font-size="19" font-weight="600" fill="#1f1640" text-anchor="middle">your device</text>
  <path d="M176 129 H262" stroke="#b3a1ff" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
  <rect x="192" y="116" width="62" height="26" rx="13.0" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="223.0" y="134.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">TCP</text>
  <path d="M176 165 H262" stroke="#b3a1ff" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
  <rect x="192" y="152" width="62" height="26" rx="13.0" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="223.0" y="170.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">UDP</text>
  <path d="M176 201 H262" stroke="#b3a1ff" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
  <rect x="192" y="188" width="62" height="26" rx="13.0" fill="#8f79f0" filter="url(#shadow)"/>
  <text x="223.0" y="206.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">ICMP</text>
  <rect x="268" y="94" width="112" height="124" rx="16" fill="url(#purple)" filter="url(#shadow)"/>
  <rect x="282" y="82" width="9" height="12" rx="2.5" fill="#8a6dff"/>
  <rect x="282" y="218" width="9" height="12" rx="2.5" fill="#8a6dff"/>
  <rect x="301" y="82" width="9" height="12" rx="2.5" fill="#8a6dff"/>
  <rect x="301" y="218" width="9" height="12" rx="2.5" fill="#8a6dff"/>
  <rect x="320" y="82" width="9" height="12" rx="2.5" fill="#8a6dff"/>
  <rect x="320" y="218" width="9" height="12" rx="2.5" fill="#8a6dff"/>
  <rect x="339" y="82" width="9" height="12" rx="2.5" fill="#8a6dff"/>
  <rect x="339" y="218" width="9" height="12" rx="2.5" fill="#8a6dff"/>
  <rect x="358" y="82" width="9" height="12" rx="2.5" fill="#8a6dff"/>
  <rect x="358" y="218" width="9" height="12" rx="2.5" fill="#8a6dff"/>
  <text x="324" y="156" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">TUN</text>
  <text x="324" y="182" font-size="16" font-weight="600" fill="#ebe5ff" text-anchor="middle">adapter</text>
  <path d="M386 156 H412" fill="none" stroke="#7b5cff" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="420" y="112" width="96" height="88" rx="16" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="468" y="151" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">TCP</text>
  <text x="468" y="176" font-size="16" font-weight="700" fill="#eafffb" text-anchor="middle">stack</text>
  <path d="M522 156 C 540 148, 548 128, 566 128" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M522 156 C 540 164, 548 184, 566 184" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="560" y="106" width="18" height="100" rx="9" fill="none"/>
  <text x="468" y="258" font-size="19" font-weight="600" fill="#1f1640" text-anchor="middle">packets in, streams out</text>
  <text x="573" y="134" font-size="22" font-weight="800" fill="#5b37e6" text-anchor="start">{ }</text>
  <text x="573" y="190" font-size="22" font-weight="800" fill="#5b37e6" text-anchor="start">{ }</text>
</svg>
