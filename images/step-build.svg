<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="dotnet build makes the app for Android, iOS, Windows and Linux">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f6ff"/><stop offset="1" stop-color="#e8e0ff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6dff"/><stop offset="1" stop-color="#4a25c9"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2190"/><stop offset="1" stop-color="#1c0f45"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4af0d2"/><stop offset="1" stop-color="#119e87"/></linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#d9ceff"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c4b6ff" opacity="0.5"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a1660" flood-opacity="0.2"/></filter>
    <filter id="spot" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#2a1660" flood-opacity="0.22"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5cff"/></marker>
  </defs>
  <rect x="2" y="2" width="256" height="156" rx="24" fill="url(#backdrop)"/>
  <rect x="2" y="2" width="256" height="156" rx="24" fill="url(#dots)"/>
  <rect x="12" y="12" width="236" height="30" rx="8" fill="url(#deep)" filter="url(#shadow)"/>
  <text x="26" y="32" font-size="14" font-weight="600" fill="#4af0d2" font-family="Consolas, 'Cascadia Mono', monospace">$ dotnet build</text>
  <rect x="12" y="52" width="114" height="46" rx="10" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#spot)"/>
  <rect x="24" y="60" width="16" height="30" rx="4" fill="url(#deep)"/><circle cx="32" cy="73" r="4.6" fill="none" stroke="#4af0d2" stroke-width="2"/>
  <text x="54" y="80" font-size="14" font-weight="700" fill="#1f1640" text-anchor="start">Android</text>
  <rect x="134" y="52" width="114" height="46" rx="10" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#spot)"/>
  <rect x="146" y="60" width="16" height="30" rx="4" fill="url(#deep)"/><circle cx="154" cy="73" r="4.6" fill="none" stroke="#4af0d2" stroke-width="2"/>
  <text x="176" y="80" font-size="14" font-weight="700" fill="#1f1640" text-anchor="start">iOS</text>
  <rect x="12" y="106" width="114" height="46" rx="10" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#spot)"/>
  <rect x="20" y="117" width="26" height="18" rx="3" fill="url(#deep)"/><path d="M17 137 h32 l-3 4 h-26 z" fill="#c9bcff"/><circle cx="33" cy="126" r="4.2" fill="none" stroke="#4af0d2" stroke-width="1.9"/>
  <text x="54" y="134" font-size="14" font-weight="700" fill="#1f1640" text-anchor="start">Windows</text>
  <rect x="134" y="106" width="114" height="46" rx="10" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#spot)"/>
  <rect x="142" y="117" width="26" height="18" rx="3" fill="url(#deep)"/><path d="M139 137 h32 l-3 4 h-26 z" fill="#c9bcff"/><circle cx="155" cy="126" r="4.2" fill="none" stroke="#4af0d2" stroke-width="1.9"/>
  <text x="176" y="134" font-size="14" font-weight="700" fill="#1f1640" text-anchor="start">Linux</text>
</svg>
