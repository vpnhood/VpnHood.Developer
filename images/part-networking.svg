  <text x="77" y="56" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">TUN</text>
  <path d="M110 50 H121" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="124" y="33" width="32" height="34" rx="9" fill="url(#teal)" filter="url(#spot)"/>
  <text x="140" y="55" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">{ }</text>
