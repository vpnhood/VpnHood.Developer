<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Three steps: use VpnHood.App.Template, make it yours in app.props, appsettings.json, branding and icons, and build it with dotnet for Android, iOS, Windows and Linux">
