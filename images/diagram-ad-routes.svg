<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="A connect's ad is tried in three ways: before the VPN, on the device's own network; beside the VPN, its traffic going around the tunnel; and through the VPN, by the VPN server, for the networks that serve VPN users">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f6ff"/><stop offset="1" stop-color="#e8e0ff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6dff"/><stop offset="1" stop-color="#4a25c9"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2190"/><stop offset="1" stop-color="#1c0f45"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4af0d2"/><stop offset="1" stop-color="#119e87"/></linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#d9ceff"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c4b6ff" opacity="0.5"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a1660" flood-opacity="0.2"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5cff"/></marker>
  </defs>
  <rect x="2" y="2" width="686" height="306" rx="24" fill="url(#backdrop)"/>
  <rect x="2" y="2" width="686" height="306" rx="24" fill="url(#dots)"/>
  <rect x="18" y="14" width="206" height="236" rx="16" fill="#fff" fill-opacity="0.6" stroke="#e0d8ff" stroke-width="1.5"/>
  <circle cx="44" cy="42" r="14" fill="url(#purple)"/>
  <text x="44" y="47.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1</text>
  <text x="66" y="48" font-size="17" font-weight="700" fill="#1f1640" text-anchor="start">Before the VPN</text>
  <rect x="32" y="102" width="46" height="86" rx="10" fill="url(#deep)" filter="url(#shadow)"/><rect x="37" y="110" width="36" height="70" rx="5" fill="#2b1870"/>
  <rect x="41" y="124" width="28" height="24" rx="4" fill="url(#teal)"/><path d="M51 130 v12 l10 -6 z" fill="#fff"/>
  <rect x="41" y="156" width="28" height="5" rx="2.5" fill="#8a6dff"/><rect x="41" y="166" width="18" height="5" rx="2.5" fill="#c9bcff"/>
  <rect x="124" y="66" width="92" height="44" rx="12" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="170" y="92.5" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">ad network</text>
  <g opacity="0.3">
  <rect x="124" y="158" width="92" height="44" rx="12" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="170" y="184.5" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">VPN server</text>
  </g>
  <path d="M80 128 C 104 128, 98 88, 118 88" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="121" y="230" font-size="14" font-weight="600" fill="#5d5584" text-anchor="middle">the VPN is not up yet</text>
  <rect x="242" y="14" width="206" height="236" rx="16" fill="#fff" fill-opacity="0.6" stroke="#e0d8ff" stroke-width="1.5"/>
  <circle cx="268" cy="42" r="14" fill="url(#purple)"/>
  <text x="268" y="47.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">2</text>
  <text x="290" y="48" font-size="17" font-weight="700" fill="#1f1640" text-anchor="start">Beside the VPN</text>
  <rect x="298" y="170" width="54" height="20" rx="10" fill="url(#tube)" stroke="#b3a1ff" stroke-width="2"/>
  <rect x="256" y="102" width="46" height="86" rx="10" fill="url(#deep)" filter="url(#shadow)"/><rect x="261" y="110" width="36" height="70" rx="5" fill="#2b1870"/>
  <rect x="265" y="124" width="28" height="24" rx="4" fill="url(#teal)"/><path d="M275 130 v12 l10 -6 z" fill="#fff"/>
  <rect x="265" y="156" width="28" height="5" rx="2.5" fill="#8a6dff"/><rect x="265" y="166" width="18" height="5" rx="2.5" fill="#c9bcff"/>
  <rect x="348" y="66" width="92" height="44" rx="12" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="394" y="92.5" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">ad network</text>
  <rect x="348" y="158" width="92" height="44" rx="12" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="394" y="184.5" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">VPN server</text>
  <path d="M304 128 C 328 128, 322 88, 342 88" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="345" y="230" font-size="14" font-weight="600" fill="#5d5584" text-anchor="middle">the ad goes around the VPN</text>
  <rect x="466" y="14" width="206" height="236" rx="16" fill="#fff" fill-opacity="0.6" stroke="#e0d8ff" stroke-width="1.5"/>
  <circle cx="492" cy="42" r="14" fill="url(#purple)"/>
  <text x="492" y="47.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">3</text>
  <text x="514" y="48" font-size="17" font-weight="700" fill="#1f1640" text-anchor="start">Through the VPN</text>
  <rect x="522" y="170" width="54" height="20" rx="10" fill="url(#tube)" stroke="#b3a1ff" stroke-width="2"/>
  <rect x="480" y="102" width="46" height="86" rx="10" fill="url(#deep)" filter="url(#shadow)"/><rect x="485" y="110" width="36" height="70" rx="5" fill="#2b1870"/>
  <rect x="489" y="124" width="28" height="24" rx="4" fill="url(#teal)"/><path d="M499 130 v12 l10 -6 z" fill="#fff"/>
  <rect x="489" y="156" width="28" height="5" rx="2.5" fill="#8a6dff"/><rect x="489" y="166" width="18" height="5" rx="2.5" fill="#c9bcff"/>
  <rect x="572" y="66" width="92" height="44" rx="12" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="618" y="92.5" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">ad network</text>
  <rect x="572" y="158" width="92" height="44" rx="12" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="618" y="184.5" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">VPN server</text>
  <path d="M530 180 H564" fill="none" stroke="#7b5cff" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M618 154 V116" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="569" y="230" font-size="14" font-weight="600" fill="#5d5584" text-anchor="middle">networks that serve VPN users</text>
  <text x="345" y="284" font-size="15" font-weight="600" fill="#5d5584" text-anchor="middle">Tried in this order until an ad shows. The app's own ad, if it has one, comes last.</text>
</svg>
