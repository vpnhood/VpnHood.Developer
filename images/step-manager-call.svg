<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="A request with curl, the bot's key in its Authorization header, and the answer: 200 OK with the server farms">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f6ff"/><stop offset="1" stop-color="#e8e0ff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6dff"/><stop offset="1" stop-color="#4a25c9"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2190"/><stop offset="1" stop-color="#1c0f45"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4af0d2"/><stop offset="1" stop-color="#119e87"/></linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#d9ceff"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c4b6ff" opacity="0.5"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a1660" flood-opacity="0.2"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5cff"/></marker>
  </defs>
  <rect x="2" y="2" width="256" height="156" rx="24" fill="url(#backdrop)"/>
  <rect x="2" y="2" width="256" height="156" rx="24" fill="url(#dots)"/>
  <rect x="12" y="12" width="236" height="56" rx="8" fill="url(#deep)" filter="url(#shadow)"/>
  <text x="24" y="34" font-size="13" font-weight="600" fill="#4af0d2" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace">$ curl …/server-farms</text>
  <text x="24" y="55" font-size="11.5" font-weight="600" fill="#c9bcff" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace">-H "Authorization: …"</text>
  <path d="M130 72 V86" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="12" y="92" width="236" height="56" rx="8" fill="#fff" stroke="#e0d8ff" stroke-width="2" filter="url(#shadow)"/>
  <rect x="22" y="110" width="52" height="20" rx="10" fill="url(#teal)"/>
  <text x="48" y="124" font-size="10.5" font-weight="800" fill="#fff" text-anchor="middle">200 OK</text>
  <text x="84" y="115" font-size="11" font-weight="600" fill="#1f1640" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace">[{ "serverFarm": {</text>
  <text x="92" y="134" font-size="11" font-weight="600" fill="#5b37e6" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace">"serverFarmName": …</text>
</svg>
