<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="A client's TCP connections reach its server each through a proxy; its UDP and QUIC are off while a proxy is on">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f6ff"/><stop offset="1" stop-color="#e8e0ff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6dff"/><stop offset="1" stop-color="#4a25c9"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2190"/><stop offset="1" stop-color="#1c0f45"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4af0d2"/><stop offset="1" stop-color="#119e87"/></linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#d9ceff"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c4b6ff" opacity="0.5"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a1660" flood-opacity="0.2"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5cff"/></marker>
  </defs>
  <rect x="2" y="2" width="616" height="296" rx="24" fill="url(#backdrop)"/>
  <rect x="2" y="2" width="616" height="296" rx="24" fill="url(#dots)"/>
  <text x="69" y="44" font-size="19" font-weight="600" fill="#1f1640" text-anchor="middle">client</text>
  <text x="302" y="44" font-size="19" font-weight="600" fill="#1f1640" text-anchor="middle">proxies</text>
  <text x="526" y="44" font-size="19" font-weight="600" fill="#1f1640" text-anchor="middle">server</text>
  <rect x="34" y="62" width="70" height="136" rx="14" fill="url(#deep)" filter="url(#shadow)"/>
  <rect x="40" y="72" width="58" height="116" rx="7" fill="#2b1870"/>
  <circle cx="69" cy="116" r="17" fill="none" stroke="url(#teal)" stroke-width="5"/>
  <path d="M64.25 116 l4.8 4.8 l8.7 -9.3" fill="none" stroke="#4af0d2" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="51" y="150" width="36" height="7" rx="3.5" fill="#8a6dff"/><rect x="51" y="164" width="24" height="7" rx="3.5" fill="#c9bcff"/>
  <path d="M110 131 C 170 131, 186 81, 240 81" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M362 81 H458" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M110 131 H240" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M362 131 H458" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M110 131 C 170 131, 186 181, 240 181" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M362 181 H458" fill="none" stroke="#7b5cff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="248" y="61" width="108" height="40" rx="12" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="302" y="87" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">SOCKS5</text>
  <rect x="248" y="111" width="108" height="40" rx="12" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="302" y="137" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">HTTP</text>
  <rect x="248" y="161" width="108" height="40" rx="12" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="302" y="187" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">SOCKS4</text>
  <rect x="146" y="118" width="54" height="26" rx="13.0" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="173.0" y="136.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">TCP</text>
  <rect x="466" y="65" width="112" height="32" rx="9" fill="url(#purple)" filter="url(#shadow)"/>
  <circle cx="484" cy="81" r="4.5" fill="#4af0d2"/><rect x="498" y="78" width="62" height="6" rx="3" fill="#c9bcff"/>
  <rect x="466" y="115" width="112" height="32" rx="9" fill="url(#purple)" filter="url(#shadow)"/>
  <circle cx="484" cy="131" r="4.5" fill="#4af0d2"/><rect x="498" y="128" width="62" height="6" rx="3" fill="#c9bcff"/>
  <rect x="466" y="165" width="112" height="32" rx="9" fill="url(#purple)" filter="url(#shadow)"/>
  <circle cx="484" cy="181" r="4.5" fill="#4af0d2"/><rect x="498" y="178" width="62" height="6" rx="3" fill="#c9bcff"/>
  <rect x="222" y="227" width="56" height="26" rx="13.0" fill="#d6ccfb"/>
  <text x="250.0" y="245.04" font-size="14" font-weight="700" fill="#8a7fc0" text-anchor="middle">UDP</text>
  <path d="M228 240 H272" stroke="#6a5ca8" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="292" y="227" width="62" height="26" rx="13.0" fill="#d6ccfb"/>
  <text x="323.0" y="245.04" font-size="14" font-weight="700" fill="#8a7fc0" text-anchor="middle">QUIC</text>
  <path d="M298 240 H348" stroke="#6a5ca8" stroke-width="2.4" stroke-linecap="round"/>
  <text x="302" y="280" font-size="16" font-weight="600" fill="#5d5584" text-anchor="middle">off while a proxy is on: the tunnel takes TCP</text>
</svg>
